[project]
name = "airport-simulation-platform"
version = "1.0.0"
description = "Member 1 airport disruption simulation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "simpy>=4.1,<5",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
# Member 2 data pipeline (backend.data): `uv run --group data ...`
data = ["pandas==3.1.0", "numpy==2.4.6", "tzdata==2026.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
